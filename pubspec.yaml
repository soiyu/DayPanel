name: daypanel
description: Offline habits, records and home widgets with optional one-time Plus.
publish_to: none
version: 0.2.1+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path: ^1.9.1
  sqflite: ^2.4.2
  uuid: ^4.5.1
  crypto: ^3.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only desktop SQLite. Keep v2 together: v3 native hooks otherwise
  # require an Android NDK even though the app uses Android's SQLite.
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.9.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL-NotoSerifSC.txt
    - assets/habit_icons/
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
